<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Fondo Circular Suave -->
  <circle cx="60" cy="60" r="58" fill="#EBF3F5" stroke="#3F6253" stroke-width="3"/>

  <!-- Sombrerito de Mago en la cabeza -->
  <polygon points="60,8 44,38 76,38" fill="#2E2344"/>
  <ellipse cx="60" cy="38" rx="20" ry="4" fill="#3D3059"/>
  <path d="M47 34 Q60 37 73 34" stroke="#D4AF37" stroke-width="2.5" fill="none"/>
  <polygon points="60,18 62,24 68,24 63,28 65,34 60,30 55,34 57,28 52,24 58,24" fill="#D4AF37"/>

  <!-- Cuerpo del Pingüino -->
  <ellipse cx="60" cy="72" rx="36" ry="40" fill="#242B35"/>
  
  <!-- Aletas laterales -->
  <ellipse cx="26" cy="74" rx="8" ry="18" fill="#1C222B" transform="rotate(20 26 74)"/>
  <ellipse cx="94" cy="74" rx="8" ry="18" fill="#1C222B" transform="rotate(-20 94 74)"/>

  <!-- Pecho y Rostro Blanco -->
  <ellipse cx="60" cy="74" rx="26" ry="32" fill="#FFFFFF"/>
  <ellipse cx="48" cy="52" rx="12" ry="14" fill="#FFFFFF"/>
  <ellipse cx="72" cy="52" rx="12" ry="14" fill="#FFFFFF"/>

  <!-- Ojos Grandes de Pingüino -->
  <circle cx="50" cy="54" r="5" fill="#1A202C"/>
  <circle cx="70" cy="54" r="5" fill="#1A202C"/>
  <circle cx="48" cy="52" r="1.8" fill="#FFFFFF"/>
  <circle cx="68" cy="52" r="1.8" fill="#FFFFFF"/>

  <!-- Pico Naranja -->
  <polygon points="60,65 52,58 68,58" fill="#F68B1F" stroke="#D96E06" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Mejillas Sonrosadas -->
  <circle cx="42" cy="61" r="3.5" fill="#F8B4B8" opacity="0.6"/>
  <circle cx="78" cy="61" r="3.5" fill="#F8B4B8" opacity="0.6"/>

  <!-- Pajarita / Bufanda Gryffindor -->
  <polygon points="60,76 48,70 48,82" fill="#8B2635"/>
  <polygon points="60,76 72,70 72,82" fill="#8B2635"/>
  <circle cx="60" cy="76" r="4" fill="#D4AF37"/>
</svg>
